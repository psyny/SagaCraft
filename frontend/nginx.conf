# Template: the nginx image fills ${PORT} at startup (Railway sets PORT; default 80).
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets can be cached for long; index.html must not be
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
