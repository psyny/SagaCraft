# Local development: frontend (hot reload), API (auto reload), Postgres.
# Ports avoid the sibling projects (3000/8000/5432) so they can run side by side.
services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3100:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://localhost:8100
    depends_on:
      - backend-api

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    ports:
      - "8100:8000"
    # Live code: edits under backend/sagacraft reload the API without rebuilding
    volumes:
      - ./backend/sagacraft:/app/sagacraft
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      PYTHONUNBUFFERED: 1
      APP_ENV: development
      DATABASE_URL: postgresql://sagacraft:sagacraft@postgres:5432/sagacraft
      CORS_ORIGINS: http://localhost:3100
      RUN_MIGRATIONS_ON_STARTUP: "true"
      ROOT_ADMIN_LOGIN: admin
      ROOT_ADMIN_PASSWORD: admin123
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sagacraft
      POSTGRES_USER: sagacraft
      POSTGRES_PASSWORD: sagacraft
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
