# Production-like build on your machine (nginx static frontend, production settings), same images as Railway.
services:
  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8100
    ports:
      - "8180:80"
    depends_on:
      - backend-api

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    ports:
      - "8100:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      APP_ENV: production
      PORT: "8000"
      DATABASE_URL: postgresql://sagacraft:sagacraft@postgres:5432/sagacraft
      CORS_ORIGINS: http://localhost:8180
      JWT_SECRET_KEY: local-production-test-secret-change-me-0123456789
      RUN_MIGRATIONS_ON_STARTUP: "true"
      ROOT_ADMIN_LOGIN: admin
      ROOT_ADMIN_PASSWORD: admin123
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sagacraft
      POSTGRES_USER: sagacraft
      POSTGRES_PASSWORD: sagacraft
    ports:
      - "5443:5432"
    volumes:
      - postgres_prod_local_data:/var/lib/postgresql/data

volumes:
  postgres_prod_local_data:
